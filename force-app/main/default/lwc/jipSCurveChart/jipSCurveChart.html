<template>
    <lightning-card title="進捗 vs 予定（Sカーブ）" icon-name="utility:trending">
        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>
            <template if:false={isLoading}>
                <div class="chart-wrapper">
                    <canvas lwc:ref="chartCanvas"></canvas>
                </div>
                <div class="info-row">
                    <span class="info-planned">&#9644; 計画</span>
                    <span class="info-actual">&#9644; 実績</span>
                    <span class="info-gap" lwc:if={hasGap}>差異: {gapTasks}タスク</span>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
